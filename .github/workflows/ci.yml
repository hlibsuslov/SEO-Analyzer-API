name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy seo_analyzer
      - run: pytest --cov --cov-report=term-missing --cov-report=xml
      - if: matrix.python-version == '3.15'
        run: pip-audit

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.15"
      - run: python -m pip install --upgrade build pip
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - name: Verify installed wheel outside the source tree
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          from importlib.metadata import distribution
          from seo_analyzer.api import create_app

          assert create_app().title
          files = {str(path) for path in distribution("saas-seo-analyzer").files}
          for license_file in ("LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/link-graph-explorer-oss.LICENSE"):
              assert any(path.endswith("/licenses/" + license_file) for path in files), license_file
          PY

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          load: true
          tags: saas-seo-analyzer:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify container health and bundled licenses
        run: |
          docker run --detach --name analyzer --publish 127.0.0.1:8000:8000 \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            saas-seo-analyzer:test
          trap 'docker logs analyzer; docker rm --force --volumes analyzer' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/readyz; then
              break
            fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8000/healthz
          curl --fail http://127.0.0.1:8000/readyz
          docker exec analyzer python -c "from importlib.metadata import distribution; files = {str(p) for p in distribution('saas-seo-analyzer').files}; assert any(p.endswith('/licenses/licenses/link-graph-explorer-oss.LICENSE') for p in files)"
