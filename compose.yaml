services:
  api:
    build: .
    init: true
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      SEO_SCAN_STORAGE_PATH: /data/analyzer.db
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    volumes:
      - analyzer-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  analyzer-data:
